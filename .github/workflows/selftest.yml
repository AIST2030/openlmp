name: selftest
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Skill 全部符合 schema + 纯度规则
      - name: Validate all skills
        run: python runtime/lmp.py validate skills/
      # evidence:high 的引用必须命中「已核验白名单」——防张冠李戴 / 卷期错 / 查无来源
      # （schema 校验看不到引用真假，这是补上那个死角）
      - name: Citation lint (evidence:high refs)
        run: python tools/citation_lint.py
      # 端到端自检（含 3 类反向测试 + SM-2 边界 + CID 稳定性）
      - name: End-to-end selftest
        run: python runtime/lmp.py selftest
      # 确认无第三方依赖：运行在裸解释器上即为证明
      # 注：sys.stdlib_module_names 是 3.10+ 特性，3.8 走 site-packages 路径判定
      - name: Confirm zero dependencies
        run: |
          python -c "
          import sys, re
          src = open('runtime/lmp.py', encoding='utf-8').read()
          mods = set(re.findall(r'^import (\w+)', src, re.M)) | set(re.findall(r'^from (\w+)', src, re.M))
          if hasattr(sys, 'stdlib_module_names'):
              std = set(sys.stdlib_module_names)
              ext = mods - std
          else:
              # 3.8/3.9：无 stdlib_module_names，改用 importlib 逐个探测来源
              import importlib.util as u
              ext = set()
              for m in mods:
                  s = u.find_spec(m)
                  if s and s.origin and 'site-packages' in s.origin or (s and s.origin and 'dist-packages' in s.origin):
                      ext.add(m)
          assert not ext, '发现非标准库依赖: %s' % ext
          print('OK 零第三方依赖，导入模块:', sorted(mods))
          "